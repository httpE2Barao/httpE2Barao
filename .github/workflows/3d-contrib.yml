name: Atualiza 3D Contrib

on:
  schedule:
    # 2x/dia fora do pico da meia-noite UTC (23:17 e 11:17 BRT).
    # Meia-noite UTC e horario de pico e o GitHub atrasa o schedule em 4-6h.
    - cron: '17 2,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 3d-contrib
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Define ano corrente (a prova de virada de ano)
        run: echo "YEAR=$(date +%Y)" >> "$GITHUB_ENV"

      - name: Gera gráfico 3D
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          YEAR: ${{ env.YEAR }}

      - name: Busca metricas do perfil (seguidores + repos)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "FOLLOWERS=$(gh api users/${{ github.repository_owner }} --jq .followers)" >> "$GITHUB_ENV"
          echo "REPOS=$(gh api users/${{ github.repository_owner }} --jq .public_repos)" >> "$GITHUB_ENV"

      - name: Recorta dias futuros e troca rodape (termina hoje)
        run: >
          python3 .github/scripts/trim-future.py --year "${{ env.YEAR }}"
          --followers "${{ env.FOLLOWERS }}" --repos "${{ env.REPOS }}"
          profile-3d-contrib/

      - name: Commit e Push dos gráficos atualizados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase --autostash || true
          git add -A profile-3d-contrib/
          if git diff --staged --quiet; then
            echo "Sem mudancas nos graficos — nada a commitar."
          else
            git commit -m "chore: update 3d contribution graph for $YEAR [skip ci]" && git push
          fi
